:root {color-scheme:dark;--ink:#edf4f7;--muted:#a0afb9;--teal:#2dd4bf;--line:#29373d}

.panel {border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#070d10}

button,select {font:inherit;color:var(--ink);border:1px solid #3d5059;background:#111c22;border-radius:8px;padding:9px 11px;cursor:pointer}

button[aria-pressed=true] {background:#0c3530;border-color:var(--teal);color:#75f6e4}

figcaption {display:flex;gap:8px;align-items:center;color:#c7d4dc;font-size:12px;padding:0 6px 10px}.badge {font-size:10px;letter-spacing:.07em;color:#7dd3c5;border:1px solid #285047;border-radius:4px;padding:3px 5px}
svg {width:100%;height:auto;display:block}svg text {font-family:system-ui,sans-serif}.label {fill:#b9cbd3;font-size:15px}.small {fill:#b0c0ca;font-size:13px}.value {fill:#f2f7fa;font-size:17px;font-weight:600}
.callout {fill:none;stroke:#718892;stroke-width:1.2;stroke-dasharray:3 4}.hot {cursor:pointer}.hot:hover [data-outline],.hot[aria-pressed=true] [data-outline] {stroke:#fbbf24}
.water {fill:none;stroke:#50e3d2;stroke-width:3;stroke-linecap:round;stroke-dasharray:5 13}.closed {color:#fbbf24}.open {color:#5eead4}
.phase-panel {display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 22px;background:#0b181d}
.phase-panel h3 {margin:0 0 6px;font-size:17px}.phase-panel p {color:#b9cbd3;line-height:1.5;font-size:12px;margin:0}.valves {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.valves span {font-size:11px;padding:5px 8px;background:#070e12;border:1px solid #32434b;border-radius:6px}
.scrub label {display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}input[type=range] {width:100%;accent-color:#2dd4bf;cursor:pointer;margin:10px 0 0}
.chips {display:flex;flex-wrap:wrap;gap:8px;padding:18px 22px}.chips button {font-size:12px}
.details {display:grid;grid-template-columns:1.1fr 1fr;gap:22px;padding:20px 22px;border-top:1px solid var(--line);background:#0a1215}.details h3 {font-size:19px;margin:0 0 8px}.details p {margin:0;color:#b5c5ce;line-height:1.6}
.source {font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:8px}.facts {display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact {border-left:2px solid #237b70;padding:2px 0 2px 10px}.fact small {display:block;color:var(--muted);font-size:11px}.fact strong {display:block;font-size:16px;margin-top:3px}
.foot {display:flex;justify-content:space-between;gap:12px;padding:13px 22px;color:var(--muted);font-size:11px;line-height:1.5}.foot a {color:#a8c8d5}
@media(max-width:700px) {.toolbar {align-items:flex-start;flex-direction:column;padding:16px}.scenes {grid-template-columns:1fr}.scene+.scene {border-left:0;border-top:1px solid var(--line)}.scene svg {max-height:420px}.phase-panel,.details {grid-template-columns:1fr;padding:16px}.chips {padding:16px;gap:6px}.chips button {padding:8px}.foot {flex-direction:column;padding:14px 16px}}
</style>

<script>
(() => {
  const data = JSON.parse(document.getElementById('bm-data').textContent);
  const panel=document.querySelector('.panel');
  const fmt = (n, digits=1) => Number(n).toLocaleString('pt-BR', {minimumFractionDigits:digits, maximumFractionDigits:digits});
  const p=data.inputs, r=data.results;
  const parts = {
    beam: {title:'A unidade transforma rotação em movimento vertical', source:'Origem dos dados · placa e desenho do fabricante', description:'O motor gira a manivela, a biela movimenta o balancim e a cabeça do cavalo transmite o movimento às hastes. As dimensões c, h, d1 e d2 determinam o curso e o limite de velocidade.', facts:[['Curso de superfície · S',fmt(r.surface_stroke)+' in'],['Cadência utilizada · N',fmt(r.operating_speed)+' ciclos/min'],['Raio da manivela · c',fmt(p.crank_radius)+' in'],['Comprimento da biela · h',fmt(p.pitman_length)+' in']]},
    rods: {title:'As hastes levam o movimento até o fundo', source:'Origem dos dados · especificação das hastes e da tubulação', description:'A coluna conecta a unidade à bomba. Diâmetro, comprimento e material definem peso, alongamento e tensão. A tubulação ao redor conduz o fluido até a superfície.', facts:[['Diâmetro da haste',fmt(p.rod_diameter,3)+' in'],['Peso no ar · Wr',fmt(r.rod_weight,0)+' lbf'],['Alongamento das hastes',fmt(r.rod_stretch)+' in'],['Tubulação ancorada',p.anchored_tubing?'Sim':'Não']]},
    pump: {title:'Duas válvulas fazem o fluido avançar', source:'Origem dos dados · especificação da bomba e estimativa de eficiência', description:'Na subida ideal, a válvula de passeio fecha e a fixa abre para admitir fluido. Na descida, a fixa fecha e a de passeio abre, permitindo a passagem pelo pistão. A ampliação mostra essa sequência; o curso efetivo e a eficiência são os calculados no projeto.', facts:[['Diâmetro do pistão',fmt(p.plunger_diameter,2)+' in'],['Curso efetivo · Sp',fmt(r.plunger_stroke)+' in'],['Eficiência informada',fmt(p.efficiency*100,0)+'%'],['Vazão estimada',fmt(r.flow_rate)+' STB/d']]},
    well: {title:'O poço e o fluido definem parte da carga', source:'Origem dos dados · registros do poço, teste de nível e análise do óleo', description:'A profundidade da bomba e o nível dinâmico são medidas diferentes. O grau API caracteriza a densidade relativa do óleo. No modelo atual, a carga hidrostática usa a profundidade total da bomba; o nível dinâmico entra na elevação líquida.', facts:[['Bomba · D',fmt(p.depth,0)+' ft'],['Nível dinâmico · H',fmt(p.fluid_level,0)+' ft'],['Grau API',fmt(p.oil_api,1)+' °API'],['Pressão na cabeça',fmt(p.wellhead_pressure,0)+' psig']]},
    drive: {title:'O motor fornece potência; o redutor entrega torque', source:'Origem dos dados · cálculo do projeto e placa da unidade', description:'A potência estimada combina a elevação do fluido, o atrito e a margem escolhida. O redutor é verificado separadamente pelo torque máximo. Potência do motor e torque do redutor não são a mesma grandeza.', facts:[['Motor requerido',fmt(r.motor_power)+' hp'],['Parcela hidráulica',fmt(r.hydraulic_power)+' hp'],['Parcela de atrito',fmt(r.friction_power)+' hp'],['Torque estimado',fmt(r.peak_torque,0)+' lbf·in']]}
  };
  function selectPart(name) {
    const part = parts[name];
    document.querySelectorAll('[data-part]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.part===name)));
    document.getElementById('source').textContent=part.source;
    document.getElementById('part-title').textContent=part.title;
    document.getElementById('description').textContent=part.description;
    const facts=document.getElementById('facts');facts.replaceChildren();
    part.facts.forEach(([label,value])=>{const div=document.createElement('div');div.className='fact';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=value;div.append(small,strong);facts.append(div)});
  }
  document.querySelectorAll('[data-part]').forEach(el=>{
    el.addEventListener('click',()=>selectPart(el.dataset.part));
    if(el.tagName.toLowerCase()==='g')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPart(el.dataset.part)}});
  });
  selectPart('beam');

  const byId=id=>document.getElementById(id);
  byId('depth-value').textContent='D = '+fmt(p.depth,0)+' ft';
  byId('level-value').textContent='H = '+fmt(p.fluid_level,0)+' ft';
  byId('stroke-value').textContent='S = '+fmt(r.surface_stroke)+' in';
  byId('piston-value').textContent='Sp = '+fmt(r.plunger_stroke)+' in';
  byId('flow-value').textContent=fmt(r.flow_rate)+' STB/d';
  const fluidY=375+Math.min(1,Math.max(0,p.fluid_level/p.depth))*127;
  byId('fluid').setAttribute('y',fluidY);byId('fluid').setAttribute('height',514-fluidY);
  byId('fluid-level').setAttribute('d',`M504 ${fluidY}H557`);
  byId('level-callout').setAttribute('d',`M504 ${fluidY}H481V433H471`);
  const motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
  let paused=motionQuery.matches, angle=.5, last=0, request, inView=true, pace=1, lastPhase='';
  const visibility=new IntersectionObserver(entries=>{inView=entries[0].isIntersecting});visibility.observe(panel);
  const pause=byId('pause'), cycle=byId('cycle');
  const moving=Object.fromEntries(['beam','pitman','pitman-shadow','crank-assembly','pulley','rod','carrier','bridle','couplings','mini-plunger','zoom-plunger','zoom-rod','chamber','travel-ball','standing-ball','travel-callout','travel-name','travel-name-2','travel-state','travel-flow','intake-flow','lift-flow','outflow','well-flow'].map(id=>[id,byId(id)]));
  function updatePause(){pause.textContent=paused?'Retomar animação':'Pausar animação';pause.setAttribute('aria-pressed',String(paused));}
  function setValve(id, open, label){byId(id+'-state').textContent=open?'ABERTA':'FECHADA';byId(id+'-state').style.fill=open?'#5eead4':'#e9be69';const chip=byId(id+'-chip');chip.textContent=label+' · '+(open?'aberta':'fechada');chip.className=open?'open':'closed';}
  function draw(){
    const pose=PumpMotion.at(angle), degrees=angle*180/Math.PI, plungerY=130+150*pose.fraction;
    moving.beam.setAttribute('transform',`rotate(${pose.beamAngle*180/Math.PI} 300 170)`);
    ['pitman','pitman-shadow'].forEach(id=>{const line=moving[id];line.setAttribute('x1',pose.pin.x);line.setAttribute('y1',pose.pin.y);line.setAttribute('x2',pose.joint.x);line.setAttribute('y2',pose.joint.y)});
    moving['crank-assembly'].setAttribute('transform',`rotate(${degrees} 165 300)`);
    moving.pulley.setAttribute('transform',`rotate(${degrees*4} 152 319)`);
    moving.carrier.setAttribute('transform',`translate(0 ${pose.carrierY})`);
    moving.bridle.setAttribute('d',`M530 170V${pose.carrierY}`);
    moving.rod.setAttribute('y1',pose.carrierY);moving.rod.setAttribute('y2',478+pose.fraction*12);
    moving.couplings.setAttribute('transform',`translate(0 ${pose.fraction*12})`);
    moving['mini-plunger'].setAttribute('y',478+pose.fraction*12);
    moving['zoom-plunger'].setAttribute('transform',`translate(0 ${plungerY})`);
    moving['zoom-rod'].firstElementChild.setAttribute('height',plungerY-64);
    moving.chamber.setAttribute('y',plungerY+79);moving.chamber.setAttribute('height',430-plungerY-79);
    moving['travel-ball'].setAttribute('cy',pose.travelingOpen?39:54);
    moving['standing-ball'].setAttribute('cy',pose.standingOpen?399:415);
    moving['travel-callout'].setAttribute('d',`M180 ${plungerY+54}H205`);
    ['travel-name','travel-name-2','travel-state'].forEach((id,i)=>moving[id].setAttribute('y',plungerY+35+i*20));
    // Pontos indicam direção; não representam a velocidade local do fluido.
    ['travel-flow','intake-flow','lift-flow','well-flow','outflow'].forEach(id=>moving[id].setAttribute('stroke-dashoffset',-angle*24));
    moving['travel-flow'].style.opacity=pose.travelingOpen?'1':'.08';
    moving['intake-flow'].style.opacity=pose.standingOpen?'1':'.08';
    moving['lift-flow'].style.opacity=pose.up&&!pose.reversing?'.8':'.12';
    moving['well-flow'].style.opacity=pose.up&&!pose.reversing?'.8':'.12';
    moving.outflow.style.opacity=pose.up&&!pose.reversing?'.8':'.12';
    const phase=pose.reversing?'turn':pose.up?'up':'down';
    if(phase!==lastPhase){lastPhase=phase;byId('phase').textContent=phase==='turn'?'Inversão do movimento':pose.up?'↑ Subida · admissão e elevação':'↓ Descida · passagem pelo pistão';
      byId('phase-description').textContent=phase==='turn'?'O movimento muda de sentido. As válvulas são mostradas fechadas durante a inversão ideal.':pose.up?'O pistão sobe, sustenta a coluna de fluido e admite líquido pela válvula fixa.':'O pistão desce. O fluido passa pela válvula de passeio; a válvula fixa impede o retorno ao poço.';
      setValve('standing',pose.standingOpen,'Fixa');setValve('travel',pose.travelingOpen,'Passeio');}
    const percent=angle/(2*Math.PI)*100;cycle.value=percent;byId('cycle-value').textContent=fmt(percent,0)+'%';
    cycle.setAttribute('aria-valuetext',fmt(percent,0)+'% do ciclo; '+(pose.up?'subida':'descida'));
  }
  function updateCadence(){byId('cadence').textContent=fmt(r.operating_speed)+' ciclos/min no projeto · visual '+fmt(pace,2)+'×';}
  function tick(now){if(last&&!paused&&inView&&document.visibilityState==='visible'){angle=(angle+Math.min(now-last,100)*r.operating_speed/60000*2*Math.PI*pace)%(2*Math.PI);draw()}last=now;request=requestAnimationFrame(tick);}
  pause.addEventListener('click',()=>{paused=!paused;updatePause()});
  byId('pace').addEventListener('change',e=>{pace=Number(e.target.value);updateCadence()});
  cycle.addEventListener('input',()=>{paused=true;angle=Number(cycle.value)/100*2*Math.PI;draw();updatePause()});
  motionQuery.addEventListener('change',e=>{paused=e.matches;updatePause()});
  window.addEventListener('pagehide',()=>{cancelAnimationFrame(request);visibility.disconnect()});
  draw();updatePause();updateCadence();request=requestAnimationFrame(tick);
})();
</script></body></html>
